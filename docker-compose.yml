version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartkisan-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./smart_kisan.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - IMD_API_KEY=${IMD_API_KEY:-}
      - OPEN_METEO_BASE_URL=https://api.open-meteo.com/v1
      - SOILGRIDS_BASE_URL=https://rest.isric.org/soilgrids/v2.0
      - ADMIN_API_KEY=smartkisan_admin_secret_2026
    volumes:
      - backend-data:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartkisan-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
